[pytest]
testpaths = tests
pythonpath = .
# Slow tests are excluded by default: each local generation takes minutes on an
# M1, which is too long for the edit-test loop. Run them with `pytest -m slow`.
addopts = -q -m "not slow"
# Coverage on demand rather than always: it slows the edit-test loop for a
# number nobody reads on every run. `make coverage` turns it on.
markers =
    integration: talks to a live Ollama server; skipped automatically when it is not running
    slow: runs local text generation (minutes per test); excluded unless `-m slow`
filterwarnings =
    ignore::DeprecationWarning
